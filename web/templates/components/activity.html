<!-- DNS Activity Component: domain-level lookups per peer -->
<div class="page-header">
    <h2>Activity</h2>
    <p>Domain-level lookups made by each connected peer (from DNS query logging - not full URLs, since that would require breaking HTTPS)</p>
</div>

<div class="content-section">
    <div class="section-header">
        <h3>Recent DNS Activity</h3>
        <div class="section-actions">
            <div class="custom-dropdown custom-dropdown-compact" id="activity-peer-filter-dropdown">
                <button type="button" class="custom-dropdown-trigger" id="activity-peer-filter-trigger">
                    <span id="activity-peer-filter-trigger-label">All peers/clients</span>
                    <i class="fas fa-chevron-down"></i>
                </button>
                <div class="custom-dropdown-panel" id="activity-peer-filter-panel" hidden></div>
            </div>
            <select id="activity-peer-filter" onchange="loadDnsActivity(1)" style="display: none;">
                <option value="">All peers/clients</option>
            </select>
            <div class="custom-dropdown custom-dropdown-compact" id="activity-protocol-filter-dropdown">
                <button type="button" class="custom-dropdown-trigger" id="activity-protocol-filter-trigger">
                    <span id="activity-protocol-filter-trigger-label">All protocols</span>
                    <i class="fas fa-chevron-down"></i>
                </button>
                <div class="custom-dropdown-panel" id="activity-protocol-filter-panel" hidden></div>
            </div>
            <select id="activity-protocol-filter" onchange="loadDnsActivity(1)" style="display: none;">
                <option value="">All protocols</option>
                <option value="WireGuard">WireGuard</option>
                <option value="OpenVPN">OpenVPN</option>
            </select>
            <button class="btn btn-secondary" onclick="loadDnsActivity()">
                <i class="fas fa-sync"></i> Refresh
            </button>
        </div>
    </div>

    <div class="table-container">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Time</th>
                    <th>Peers/Clients</th>
                    <th>Protocol</th>
                    <th>Domain</th>
                </tr>
            </thead>
            <tbody id="dns-activity-table">
                <tr><td colspan="4" class="text-center">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="pagination-controls" style="display: flex; align-items: center; justify-content: center; gap: 12px; padding: 16px 0 4px;">
        <button class="btn btn-sm btn-secondary" id="activity-prev-page" onclick="changeDnsActivityPage(-1)" disabled>
            <i class="fas fa-chevron-left"></i> Previous
        </button>
        <span id="activity-page-indicator" class="text-muted">Page 1 of 1</span>
        <button class="btn btn-sm btn-secondary" id="activity-next-page" onclick="changeDnsActivityPage(1)" disabled>
            Next <i class="fas fa-chevron-right"></i>
        </button>
    </div>
</div>
