
services:
  # WireGuard VPN Server
  wireguard:
    image: linuxserver/wireguard:latest
    container_name: bartolo-wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - SERVERURL=${SERVER_IP}
      - SERVERPORT=${WIREGUARD_PORT:-51820}
      - PEERS=${WIREGUARD_PEERS:-10}
      - PEERDNS=auto
      - INTERNAL_SUBNET=${WIREGUARD_SUBNET:-10.13.13.0}
      - ALLOWEDIPS=${WIREGUARD_ALLOWED_IPS:-0.0.0.0/0}
      - LOG_CONFS=true
    volumes:
      - ./config/wireguard:/config
      - /lib/modules:/lib/modules
    ports:
      - "${WIREGUARD_PORT:-51820}:51820/udp"
      - "${API_PORT:-5000}:5000"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    restart: unless-stopped
    network_mode: bridge

  # OpenVPN Server
  openvpn:
    image: kylemanna/openvpn:latest
    container_name: bartolo-openvpn
    privileged: true
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ./config/openvpn:/etc/openvpn
      - ./scripts:/scripts
    ports:
      - "${OPENVPN_PORT:-1194}:1194/udp"
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1
    restart: unless-stopped
    networks:
      - vpn-network
      - vpn-external
    depends_on:
      - wireguard
    command: /scripts/init-openvpn-proper.sh

  # IKEv2 VPN Server (using strongSwan)
  ikev2:
    image: hwdsl2/ipsec-vpn-server:latest
    container_name: bartolo-ikev2
    privileged: true
    environment:
      - VPN_IPSEC_PSK=${IKEV2_PSK:-your-ikev2-psk}
      - VPN_USER=${IKEV2_USER:-vpnuser}
      - VPN_PASSWORD=${IKEV2_PASSWORD:-vpnpass}
    ports:
      - "500:500/udp"
      - "4500:4500/udp"
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.accept_redirects=0
      - net.ipv4.conf.all.send_redirects=0
      - net.ipv4.conf.all.rp_filter=1
      - net.ipv4.conf.default.accept_redirects=0
      - net.ipv4.conf.default.send_redirects=0
      - net.ipv4.conf.default.rp_filter=1
    restart: unless-stopped
    networks:
      - vpn-network
      - vpn-external
    depends_on:
      - wireguard



  # Scoped Docker API access for vpn-api: container log fetching (DNS
  # Activity tab, reads wireguard's stdout) and exec (OpenVPN client
  # certs have to be generated with the openvpn container's own easyrsa -
  # that toolchain isn't present anywhere else, including vpn-api itself).
  # Every other resource type stays disabled - this is not a general docker
  # socket passthrough, only container list/inspect/logs/exec.
  docker-log-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: bartolo-docker-log-proxy
    environment:
      - CONTAINERS=1
      - POST=1
      - EVENTS=0
      - INFO=0
      - NETWORKS=0
      - IMAGES=0
      - VOLUMES=0
      - EXEC=1
      - SERVICES=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=0
      - NODES=0
      - PLUGINS=0
      - SECRETS=0
      - CONFIGS=0
      - BUILD=0
      - COMMIT=0
      - DISTRIBUTION=0
      - AUTH=0
      - SESSION=0
      - GRPC=0
      - ALLOW_RESTARTS=0
    volumes:
      - /run/user/1000/docker.sock:/var/run/docker.sock:ro
    network_mode: "service:wireguard"
    depends_on:
      - wireguard
    restart: unless-stopped

  # VPN Management API
  vpn-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: bartolo-vpn-api
    cap_add:
      - NET_ADMIN
    env_file:
      - .env
    environment:
      - WIREGUARD_ENABLED=true
      - WIREGUARD_PORT=51820
      - WIREGUARD_PEERS=10
      - WIREGUARD_DNS=1.1.1.1,8.8.8.8
      - WIREGUARD_SUBNET=10.13.13.0
      - WIREGUARD_ALLOWED_IPS=0.0.0.0/0
      - OPENVPN_ENABLED=true
      - OPENVPN_PORT=1194
      - OPENVPN_PROTOCOL=udp
      - OPENVPN_CIPHER=AES-256-GCM
      - OPENVPN_AUTH=SHA256
      - IKEV2_ENABLED=true
      - IKEV2_PSK=${IKEV2_PSK}
      - IKEV2_USER=${IKEV2_USER:-vpnuser}
      - IKEV2_PASSWORD=${IKEV2_PASSWORD}

      - ENCRYPTION_LEVEL=256
      - DNS_SERVERS=1.1.1.1,8.8.8.8
      - KILL_SWITCH_ENABLED=true
      - LOG_LEVEL=INFO
      - LOG_RETENTION_DAYS=30
      - MONITORING_ENABLED=true
      - BANDWIDTH_LIMIT_MB=1000
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - LOCAL_IP=${LOCAL_IP}
      - LOCAL_IPV6=${LOCAL_IPV6:-::1}
      - PREVIOUS_IPS=${PREVIOUS_IPS:-}
      - WIREGUARD_CONFIG_PATH=/config/wireguard
      - OPENVPN_CONFIG_PATH=/config/openvpn
      - IKEV2_CONFIG_PATH=/config/ikev2
    volumes:
      - ./config:/config
      - ./api:/app
      - ./web:/app/web
    restart: unless-stopped
    network_mode: "service:wireguard"
    depends_on:
      - wireguard
      - openvpn
      - ikev2

  # Load Balancer / IP Rotator
  haproxy:
    image: haproxy:alpine
    container_name: bartolo-haproxy
    ports:
      - "8082:80"
      - "8443:443"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    restart: unless-stopped
    networks:
      - vpn-network
      - vpn-external
    depends_on:
      - wireguard
      - openvpn
      - ikev2

networks:
  vpn-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.27.0.0/16
          gateway: 172.27.0.1
  vpn-external:
    driver: bridge
    ipam:
      config:
        - subnet: 10.15.15.0/24
          gateway: 10.15.15.1
