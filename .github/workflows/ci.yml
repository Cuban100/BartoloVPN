name: CI/CD Pipeline

# Note: The security scan requires SNYK_TOKEN secret to be configured in GitHub.
# If not configured, the security scan will be skipped gracefully.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r api/requirements.txt
        pip install -r api/requirements-dev.txt

    - name: Run tests
      run: |
        cd api
        python -m pytest tests/ -v

    - name: Lint (blocking - syntax errors / undefined names)
      run: |
        pip install flake8
        flake8 api/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Format check (advisory - codebase predates black adoption)
      run: |
        pip install black
        black --check api/ || echo "::warning::Code is not black-formatted. Not blocking CI yet - run 'black api/' locally to clean this up incrementally."

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        docker build -t bartolovpn-api ./api
    
    - name: Test Docker image
      run: |
        docker run --rm bartolovpn-api python -c "import fastapi; print('FastAPI version:', fastapi.__version__)"


