name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r api/requirements.txt
        pip install pytest pytest-asyncio
    
    - name: Run tests
      run: |
        cd api
        python -m pytest tests/ -v
    
    - name: Lint code
      run: |
        pip install flake8 black
        flake8 api/ --count --select=E9,F63,F7,F82 --show-source --statistics
        black --check api/

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        docker build -t bartolovpn-api ./api
    
    - name: Test Docker image
      run: |
        docker run --rm bartolovpn-api python -c "import fastapi; print('FastAPI version:', fastapi.__version__)"

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run security scan
      uses: snyk/actions/docker@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        image: bartolovpn-api
        args: --severity-threshold=high
