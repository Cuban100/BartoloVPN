global
    daemon
    maxconn 4096
    log stdout format raw local0 info

defaults
    mode tcp
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms
    log global

# Note: HAProxy doesn't support UDP mode in this version
# VPN services are exposed directly on their ports
# HAProxy only handles HTTP traffic for web interface and API

# Web interface and API load balancing (both served from vpn-api on port 5000)
frontend web_frontend
    bind *:80
    mode http
    default_backend web_backend

backend web_backend
    mode http
    balance roundrobin
    option httpchk GET /api
    http-check expect status 200
    server web1 172.25.0.4:5000 check

# API load balancing
frontend api_frontend
    bind *:5000
    mode http
    default_backend api_backend

backend api_backend
    mode http
    balance roundrobin
    option httpchk GET /api
    http-check expect status 200
    server api1 172.25.0.4:5000 check

# Stats page
frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if TRUE
